# SPDX-License-Identifier: Apache-2.0
# DEV13 clean installation using Aurora's NEW local permanent signing key.
# Produces an UNSIGNED artifact; private key never enters GitHub Actions.
# This cannot update DEV12 in place because its certificate differs.
name: Dumbplayer DEV13 first-install unsigned APK (sign locally)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-first-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android SDK 33 build tools
        run: sdkmanager 'platforms;android-33' 'build-tools;33.0.2'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Source regression
        run: |
          bash tests/run_bluetooth_volume_seek_smoke.sh
          python3 tests/test_stale_import_source.py
          python3 tests/test_dev13_integration_source.py
      - name: Assemble unsigned release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify package identity (NOT signed)
        shell: bash
        run: |
          set -euo pipefail
          unsigned='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$unsigned"
          package="$($ANDROID_HOME/build-tools/33.0.2/aapt dump badging "$unsigned" | sed -n '1p')"
          [[ "$package" == *"name='org.roarin.kyocerakeypad.sandboxwqa365'"* ]]
          [[ "$package" == *"versionCode='16'"* ]]
          echo 'Unsigned DEV13 APK verified. Sign LOCALLY using the permanent key before installation.'
      - uses: actions/upload-artifact@v4
        with:
          name: dumbplayer-dev13-UNSIGNED-FIRST-INSTALL-NOT-READY-TO-INSTALL
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
