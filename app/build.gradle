plugins { id 'com.android.application' }
android {
    namespace 'org.roarin.kyocerakeypad'
    compileSdk 33
    buildFeatures { buildConfig true }
    defaultConfig {
        // DEV4: update the existing WQA365 sandbox only; never install a third app. Signer must match.
        applicationId 'org.roarin.kyocerakeypad.sandboxwqa365'
        minSdk 29
        targetSdk 29
        versionCode 16
        versionName '0.2.7-dev13-stale-import-bt-direction'
        // Generated by the builder at Gradle configuration time in UTC.
        def utcFormat = new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'")
        utcFormat.setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
        buildConfigField 'String', 'BUILD_UTC', '\"' + utcFormat.format(new Date()) + '\"' 
    }
    // The owner sideloads Dumbplayer onto Android 10; DEV13 retains targetSdk 29.
    // Ignore only the Google Play target-age policy check for this private release.
    // Preserve all other release lint checks and the separate signing guard.
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
